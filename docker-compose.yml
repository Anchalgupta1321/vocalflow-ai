version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
      - "5173:5173"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres123@postgres:5432/vocalflow_db?schema=public
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    container_state:
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres123
        POSTGRES_DB: vocalflow_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
